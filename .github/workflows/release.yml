# Continuous delivery: pushing a tag like v0.2.0 runs the full CI, builds the package, checks that
# the tag matches the version in pyproject.toml, and publishes a GitHub Release with the wheel and
# source archive attached. Pull requests that change the release machinery run it as a dry run.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - scripts/ci.sh
      - pyproject.toml
  workflow_dispatch: # manual dry run from the Actions tab

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHON: python

jobs:
  checks:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  release:
    name: ${{ github.event_name == 'push' && 'Publish release' || 'Release dry run' }}
    needs: checks
    # Run after the checks passed, or (dry run) when they were skipped; never after a failure.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: scripts/ci.sh setup
      - run: scripts/ci.sh package # builds dist/ and smoke-tests the installed wheel
      - name: Check the tag matches the package version
        run: |
          version="$(.ci-venv/bin/python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "pyproject.toml version: $version"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version. Bump the version, commit, and tag v$version."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Publish the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "deck-creator-agent $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
      - name: Dry-run summary
        if: github.event_name != 'push'
        run: |
          {
            echo "### Release dry run"
            echo "Pushing tag v$(.ci-venv/bin/python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])") would publish:"
            for f in dist/*; do echo "- $(basename "$f")"; done
          } >> "$GITHUB_STEP_SUMMARY"
