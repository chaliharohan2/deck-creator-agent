[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deck-creator-agent"
version = "0.1.0"
description = "A fully local, open-source AI agent that researches topics on the web and builds presentation decks (PPTX, PDF, HTML)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rohan Chaliha" }]
keywords = ["llm", "agent", "presentation", "pptx", "ollama", "local-llm", "slides"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Every runtime dependency is OSI-licensed open source (see docs/LICENSES.md).
dependencies = [
    "python-pptx>=1.0.2",   # MIT      - PowerPoint writer
    "pydantic>=2.7",        # MIT      - deck schema + tool argument validation
    "httpx>=0.27",          # BSD-3    - HTTP client for the local LLM server and web pages
    "ddgs>=9.0",            # MIT      - metasearch (DuckDuckGo, Bing, Brave, ...) with no API key
    "trafilatura>=2.0",     # Apache-2 - main-text extraction from web pages
    "pypdf>=4.0",           # BSD-3    - text extraction when a search result is a PDF
    "Pillow>=10.0",         # MIT-CMU  - image validation/conversion
    "rich>=13.0",           # MIT      - terminal UI
    "starlette>=0.37",      # BSD-3    - web UI server
    "uvicorn>=0.30",        # BSD-3    - ASGI server for the web UI
    "pypdfium2>=4.30",      # BSD-3/Apache-2 - slide images for the UI's exact PowerPoint preview
]

[project.optional-dependencies]
# Development and CI tools. ruff is pinned exactly: a new ruff release can flag code that passed
# yesterday, which is one way CI starts failing on GitHub while passing locally.
dev = ["pytest>=8", "ruff==0.17.3", "build>=1.2", "twine>=5"]
# Browser smoke test of the web UI. Pinned so CI installs the same Chromium build everywhere.
browser = ["playwright==1.63.0"]

[project.scripts]
deck-agent = "deck_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deck_agent = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "pdf: needs LibreOffice (skipped when it is missing, unless DECK_AGENT_CI_REQUIRE=pdf)",
    "browser: drives the web UI in Chromium via Playwright (skipped unless installed)",
]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
